		function onTemplateRender(event, data) {
			switch (data.renderingMode) {
				case primitives.RenderingMode.Create:
					/* Initialize template content here */
					break;
				case primitives.RenderingMode.Update:
					/* Update template content here */
					break;
			}

			var itemConfig = data.context;

			if (data.templateName == "contactTemplate") {
				var titleBackground = data.element.firstChild;
				titleBackground.style.backgroundColor = itemConfig.itemTitleColor || primitives.Colors.RoyalBlue;

				var title = data.element.firstChild.firstChild;
				title.textContent = itemConfig.title;
			} else if (data.templateName == "dot") {
				var titleBackground = data.element;
				titleBackground.style.backgroundColor = itemConfig.itemTitleColor || primitives.Colors.RoyalBlue;
			}
		}

		function getContactTemplate() {
			var result = new primitives.TemplateConfig();
			result.name = "contactTemplate";
			result.itemSize = new primitives.Size(60, 26);
			result.minimizedItemSize = new primitives.Size(3, 3);
			result.hasButtons = primitives.Enabled.False;

			result.itemTemplate = 
				'<div class="bp-item bp-corner-all bt-item-frame" style="width:' + result.itemSize.width + 'px; height: ' + result.itemSize.height + 'px;">'
				+ '<div name="titleBackground" class="bp-item bp-corner-all bp-title-frame" style="top: 2px; left: 2px; width: 116px; height: 20px;">'
					+ '<div name="title" class="bp-item bp-title" style="top: 3px; left: 6px; width: 108px; height: 18px;">'
					+ '</div>'
				+ '</div>'
			+ '</div>'

			return result;
		}

		function getDotTemplate() {
			var result = new primitives.TemplateConfig();
			result.name = "dot";

			result.isActive = false;
			result.itemSize = new primitives.Size(2, 2);
			result.minimizedItemSize = new primitives.Size(2, 2);
			result.minimizedItemCornerRadius = 4;
			result.minimizedItemLineWidth = 1;
			result.minimizedItemLineType = primitives.LineType.Solid;
			result.minimizedItemBorderColor = null; // Shape border line has the same color as item title background color 
			result.minimizedItemFillColor = null; // Shape background has the same color as item title background color 
			result.minimizedItemOpacity = 0.7; // Shape background opacity

			result.itemTemplate = ["div", {
				"style": {
				top: "2px",
				left: "2px",
				width: result.itemSize.width + "px",
				height: result.itemSize.height + "px"
				},
				"class": ["bp-corner-all"]
			}];

			return result;
		}
